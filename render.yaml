services:
  - type: web
    name: myvault
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade || flask db init && flask db migrate && flask db upgrade
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: myvault-db
          property: connectionString
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_REMINDER_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false

databases:
  - name: myvault-db
    plan: free
    databaseName: myvault
    user: myvault

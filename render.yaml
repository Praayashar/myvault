services:
  - type: web
    name: myvault
    runtime: python
    # Schema is created by db.create_all() at startup, so no flask-migrate
    # chain is needed here. The old command failed noisily on every build.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Supabase connection string
      - key: VAULT_KEY
        sync: false          # Fernet key - KEEP YOUR OWN COPY
      - key: CRON_SECRET
        sync: false          # shared with Google Apps Script
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
